<script>
/* ==========================================================================
   State + engine
   ========================================================================== */

const KEY = 'frequentFlyer.game.v1';
let G = null;          // game state
let UI = {screen:'start', sub:null, tmp:{}};

/* Spectator mode. Set once at boot and never cleared — a viewer writes nothing,
   anywhere, so their own saved game survives opening someone else's link. */
let VIEW = false;

const fmt = n => n.toLocaleString('en-US');
const uid = () => Math.random().toString(36).slice(2,9);

function newPlayer(name, home){
  return {
    id: uid(), name, home, at: home,
    miles: START_MILES,
    visited: [home],
    hand: [],            // card ids held
    skip: 0,             // turns to miss
    firstClass: false,   // for the flight in progress
    mult: 1,             // multiplier armed for the next completed flight
  };
}

function newGame(players, target){
  return {
    v: 1,
    players, target,
    turn: 0,             // index into players
    started: Date.now(),
    status: 'playing',
    winner: null,
    bounties: [],        // {city, amount, from}
    log: [],             // {id, t, who, text, detail, undo}
  };
}

/* ---------- persistence ----------
   The one place the game is written down, which makes it the one place live
   sharing has to hook into. */
function save(){
  if(VIEW) return;
  try{ localStorage.setItem(KEY, JSON.stringify(G)); }catch(e){}
  if(G && G.share && G.share.on) pushShare();
}
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} }

/* ---------- helpers ---------- */
const cur = () => G.players[G.turn];
const byId = id => G.players.find(p=>p.id===id);
const opponents = p => G.players.filter(x=>x.id!==p.id);
/* The 40-city game is the 20-city board played to two visits per city, in any
   order — you may hit the same city twice before touching the others. So
   `visited` is a list that may hold a city twice, not a set. */
const maxVisits    = () => G.target > CITIES.length ? 2 : 1;
const visitCount   = (p,c) => p.visited.reduce((n,x)=>n+(x===c?1:0), 0);
const visitedCount = p => p.visited.length;
const canVisit     = (p,c) => visitCount(p,c) < maxVisits();
const stopWord     = () => maxVisits() > 1 ? 'stops' : 'cities';

/* "Have they been here at all?" — this is what card conditions mean by
   visited, so it stays a yes/no even when two visits are allowed. */
const hasVisited = (p,c) => visitCount(p,c) > 0;

/* Snapshot just the mutable player fields + bounties, for undo. */
function snapshot(){
  return JSON.stringify({p:G.players, b:G.bounties, t:G.turn, s:G.status, w:G.winner});
}
function restore(snap){
  const o = JSON.parse(snap);
  G.players = o.p; G.bounties = o.b; G.turn = o.t; G.status = o.s; G.winner = o.w;
}

/* Every mutation goes through this so undo and the log stay in sync. */
function commit(text, detail, mutate){
  const before = snapshot();
  mutate();
  G.log.unshift({id:uid(), t:Date.now(), who:cur().name, text, detail:detail||'', undo:before});
  checkWin();
  save();
}

function undoLast(){
  const e = G.log.shift();
  if(!e) return;
  restore(e.undo);
  save();
}

/* ---------- win condition ----------
   Rules: visit the target number of cities (home counts as the first),
   then return to your home city. */
function checkWin(){
  if(G.status !== 'playing') return;
  for(const p of G.players){
    if(visitedCount(p) >= G.target && p.at === p.home && G.log.length > 0){
      G.status = 'finished'; G.winner = p.id; return;
    }
  }
}

/* ---------- core mutations ---------- */

function addMiles(p, amount){ p.miles += amount; }

/* Land a player in a city: check it off, move them, optionally pay mileage.
   Returns {earned, bonus} for logging. */
function land(p, to, earn, useMult){
  const from = p.at;
  let earned = 0;
  if(earn && from && from !== to){
    earned = milesBetween(from, to);
    if(useMult && p.mult > 1) earned *= p.mult;
  }
  p.miles += earned;
  p.at = to;
  if(canVisit(p,to)) p.visited.push(to);
  if(useMult) p.mult = 1;
  p.firstClass = false;              // the flight is over

  // Any bounty sitting on this city pays out now.
  let bonus = 0;
  G.bounties = G.bounties.filter(b=>{
    if(b.city === to){ p.miles += b.amount; bonus += b.amount; return false; }
    return true;
  });
  return {earned, bonus};
}

function advanceTurn(){
  if(G.status !== 'playing') return;
  let guard = 0;
  do {
    G.turn = (G.turn + 1) % G.players.length;
    guard++;
    if(cur().skip > 0){ cur().skip--; } else break;
  } while(guard < 40);
}

/* ---------- card effects ----------
   `ans` carries any answers the card needed: {city, oppId, oppCity, cardId, branch} */

function cardNeeds(fx){
  const need = [];
  if(fx.choice) need.push('branch');
  if(fx.fly === 'choose') need.push('city');
  if(Array.isArray(fx.fly)) need.push('cityFrom');
  if(fx.addCity === 'choose') need.push('city');
  if(fx.oppFly) need.push('opp');
  if(fx.skipOpp) need.push('opp');
  if(fx.stealCity) need.push('stealCity');
  if(fx.stealCard) need.push('stealCard');
  return need;
}

/* Resolve a branch choice down to the concrete fx before applying. */
function resolveFx(card, ans){
  let fx = card.fx;
  if(fx.choice && ans.branch != null) fx = fx.choice[ans.branch].fx;
  return fx;
}

function applyFx(p, fx, ans, notes){
  // straight mileage
  if(fx.miles) { addMiles(p, fx.miles); notes.push((fx.miles>0?'+':'')+fmt(fx.miles)+' miles'); }

  // conditional bonus on cities already visited
  if(fx.milesIf){
    const {cities, mode, amount} = fx.milesIf;
    const ok = mode === 'all'  ? cities.every(c=>hasVisited(p,c))
             : mode === 'none' ? cities.every(c=>!hasVisited(p,c))
             :                   cities.some(c=>hasVisited(p,c));
    if(ok){ addMiles(p, amount); notes.push('+'+fmt(amount)+' miles (condition met)'); }
    else  { notes.push('No bonus — condition not met'); }
  }

  // collect from every opponent
  if(fx.collectEach){
    let got = 0;
    opponents(p).forEach(o=>{ o.miles -= fx.collectEach; got += fx.collectEach; });
    addMiles(p, got);
    notes.push('+'+fmt(got)+' miles collected from '+opponents(p).length+' player(s)');
  }

  // arm a mileage multiplier
  if(fx.multiplier){ p.mult = fx.multiplier; notes.push(fx.multiplier+'× mileage armed for your next flight'); }

  // travel class
  if(fx.firstClass === true){ p.firstClass = true; notes.push('Now flying first class'); }
  if(fx.firstClass === false){ p.firstClass = false; notes.push('Back in coach'); }

  // turn skipping
  if(fx.skipSelf){ p.skip += fx.skipSelf; notes.push('Missing next '+fx.skipSelf+' turn(s)'); }
  if(fx.skipOpp && ans.oppId){
    const o = byId(ans.oppId); o.skip += fx.skipOpp;
    notes.push(o.name+' misses their next turn');
  }

  // add a city without flying there
  if(fx.addCity === 'choose' && ans.city){
    if(canVisit(p, ans.city)) p.visited.push(ans.city);
    notes.push(cityName(ans.city)+' added to your checklist');
  }

  // steal a city from an opponent
  if(fx.stealCity && ans.oppId && ans.oppCity){
    const o = byId(ans.oppId);
    const k = o.visited.indexOf(ans.oppCity);   // one visit, not all of them
    if(k >= 0) o.visited.splice(k, 1);
    if(canVisit(p, ans.oppCity)) p.visited.push(ans.oppCity);
    notes.push('Took '+cityName(ans.oppCity)+' from '+o.name);
  }

  // steal a held card
  if(fx.stealCard && ans.oppId && ans.cardId){
    const o = byId(ans.oppId);
    o.hand = o.hand.filter(c=>c!==ans.cardId);
    p.hand.push(ans.cardId);
    notes.push('Took "'+CARDS_BY_ID[ans.cardId].title+'" from '+o.name);
  }

  // force an opponent to fly somewhere (no miles for them)
  if(fx.oppFly && ans.oppId){
    const o = byId(ans.oppId);
    land(o, fx.oppFly, false, false);
    notes.push(o.name+' forced to '+cityName(fx.oppFly)+' (no miles)');
  }

  // place a bounty on a city
  if(fx.bounty){
    G.bounties.push({city:fx.bounty.city, amount:fx.bounty.amount, from:p.name});
    notes.push(fmt(fx.bounty.amount)+' miles now waiting in '+cityName(fx.bounty.city));
  }

  // relocate the player
  let dest = null;
  if(fx.flyIfNot){ if(!hasVisited(p, fx.flyIfNot)) dest = fx.flyIfNot; else notes.push(fx.flyIfNotElse||'Condition not met.'); }
  else if(fx.fly === 'home') dest = p.home;
  else if(fx.fly === 'choose' || Array.isArray(fx.fly)) dest = ans.city;
  else if(typeof fx.fly === 'string') dest = fx.fly;

  if(dest){
    const already = hasVisited(p, dest);
    const r = land(p, dest, !!fx.flyEarns, true);
    notes.push('Flew to '+cityName(dest)+(r.earned?' (+'+fmt(r.earned)+' miles)':' (no miles)'));
    if(r.bonus) notes.push('+'+fmt(r.bonus)+' bounty collected');
    if(fx.bonusIfVisited && already && fx.bonusIfVisited.city === dest){
      addMiles(p, fx.bonusIfVisited.amount);
      notes.push('+'+fmt(fx.bonusIfVisited.amount)+' bonus (already visited)');
    }
  }
}

function playCard(card, ans){
  const p = cur();
  const fx = resolveFx(card, ans);
  const notes = [];
  const holding = fx.hold && !ans.fromHand;

  commit(card.title, '', ()=>{
    if(holding){
      p.hand.push(card.id);
      notes.push('Saved to your hand');
    } else {
      applyFx(p, fx, ans, notes);
      if(ans.fromHand) p.hand = p.hand.filter(c=>c!==card.id);
    }
  });
  G.log[0].detail = notes.join(' · ') || (fx.note || 'No scoring change');
  save();
  return notes;
}

/* ---------- flights & redemptions ---------- */

function completeFlight(from, to, earns){
  const p = cur();
  let r;
  commit('Flight', '', ()=>{
    p.at = from;
    r = land(p, to, earns, true);
  });
  const bits = [cityName(from)+' → '+cityName(to)];
  if(earns) bits.push('+'+fmt(r.earned)+' miles'); else bits.push('no miles earned');
  if(r.bonus) bits.push('+'+fmt(r.bonus)+' bounty');
  G.log[0].detail = bits.join(' · ');
  save();
}

function redeem(kind, city){
  const p = cur();
  if(kind === 'choose'){
    commit('Redeemed 5,000 miles', 'Choose your destination instead of rolling', ()=>{ p.miles -= REDEEM.CHOOSE; });
  } else if(kind === 'first'){
    commit('Redeemed 10,000 miles', 'First class upgrade for this flight', ()=>{ p.miles -= REDEEM.FIRSTCLASS; p.firstClass = true; });
  } else if(kind === 'auto'){
    let r;
    commit('Redeemed 20,000 miles', '', ()=>{ p.miles -= REDEEM.AUTO; r = land(p, city, false, false); });
    let d = 'Automatic flight to '+cityName(city)+' · no miles earned';
    if(r.bonus) d += ' · +'+fmt(r.bonus)+' bounty';
    G.log[0].detail = d;
    save();
  }
}

function adjustMiles(delta, why){
  const p = cur();
  commit('Manual adjustment', (delta>0?'+':'')+fmt(delta)+' miles'+(why?' — '+why:''), ()=>{ p.miles += delta; });
}

/* Tapping a city cycles its visit count: 0 → 1 → (→ 2) → 0. */
function toggleCity(city){
  const p = cur();
  const max = maxVisits();
  const next = (visitCount(p, city) + 1) % (max + 1);
  const detail = cityName(city) + (max > 1 ? ' — now '+next+' of '+max+' visits' : '');
  commit(next ? 'Checked off city' : 'Unchecked city', detail, ()=>{
    p.visited = p.visited.filter(c=>c!==city);
    for(let i=0;i<next;i++) p.visited.push(city);
  });
}

function endTurn(){
  commit('End of turn', '', ()=>{ advanceTurn(); });
}

/* Drawing a card or finishing a flight is the end of a turn, so do it for them
   rather than making them tap End turn every single time. The banner that
   follows names who just went and offers an undo, because occasionally the
   turn wasn't over — see UI.flash in screenTurn(). */
function autoEnd(what){
  if(G.status !== 'playing'){ UI.flash = {text:what, ended:false}; return false; }
  const who = cur().name;
  endTurn();
  UI.flash = {text:what, who, next:cur().name, ended:true};
  return true;
}

/* ==========================================================================
   Recap

   commit() files a full snapshot of every player before it changes anything, so
   the log is already a frame-by-frame recording of the game. Everything below
   reads those snapshots and diffs neighbouring frames — never `e.text`, which
   is display copy and free to be reworded.
   ========================================================================== */

/* The log is newest-first, so the state *after* entry i is entry i-1's
   snapshot — or the live game, for the newest entry. Returned oldest first,
   which is the order anything narrating the game wants to walk. */
function frames(){
  // A spectator's log arrives with the snapshots stripped, so there is
  // nothing to replay. Callers fall back to the final standings.
  if(!G.log.length || !G.log[0].undo) return [];
  const out = [];
  for(let i = G.log.length - 1; i >= 0; i--){
    const b = JSON.parse(G.log[i].undo);
    const a = i === 0 ? {p:G.players, t:G.turn} : JSON.parse(G.log[i-1].undo);
    out.push({e:G.log[i], before:b.p, after:a.p, turnBefore:b.t, turnAfter:a.t});
  }
  return out;
}

/* Who is winning, or null while it's genuinely level. Cities first — they are
   the win condition — then miles as the tie-break, which is how the standings
   on the win screen are already sorted. */
function leaderOf(list){
  if(!list.length) return null;
  let best = list[0];
  list.forEach(p => {
    if(p.visited.length > best.visited.length ||
      (p.visited.length === best.visited.length && p.miles > best.miles)) best = p;
  });
  const level = list.filter(p => p.visited.length === best.visited.length &&
                                 p.miles === best.miles);
  return level.length === 1 ? best.id : null;
}

/* Players are matched by id throughout, never by name: two people at the table
   may enter the same name, and plenty of cards move somebody other than whoever
   is having the turn. */
function recapStats(){
  const fs = frames();
  const by = {};
  G.players.forEach(p => by[p.id] = {
    p, turns:0, earned:0, redeemed:0, cities:visitedCount(p),
    flights:0, haul:null, bestTurn:0,
  });

  const g = {
    full: fs.length > 0,
    rows: G.players.map(p => by[p.id]),
    turns: 0, ms: 0, leadChanges: 0, turning: null, ledThroughout: false,
    winner: G.winner ? byId(G.winner) : null,
  };
  if(!g.full) return g;

  g.ms = G.log[0].t - G.log[G.log.length-1].t;

  const running = {};                 // miles banked so far this turn
  G.players.forEach(p => running[p.id] = 0);
  const leads = [];                   // who led after each frame, null while level
  const moved = [];                   // did this frame change anyone's position?
  let lead = null;

  fs.forEach(f => {
    const post = {};
    f.after.forEach(a => post[a.id] = a);
    let material = false;

    f.before.forEach(b => {
      const a = post[b.id], s = by[b.id];
      if(!a || !s) return;                       // player from an older save
      const dm = a.miles - b.miles;
      if(dm !== 0 || a.visited.length !== b.visited.length) material = true;
      if(dm > 0) s.earned += dm; else if(dm < 0) s.redeemed -= dm;
      running[b.id] += dm;
      /* A flight is a move that ticked a city off — which is the definition
         that survives redemptions, card moves and manual corrections alike. */
      if(a.at !== b.at && a.visited.length > b.visited.length){
        s.flights++;
        if(dm > 0 && (!s.haul || dm > s.haul.miles))
          s.haul = {miles:dm, from:b.at, to:a.at};
      }
    });

    // The seat moving on is what ends a turn; bank what the outgoing player made.
    if(f.turnBefore !== f.turnAfter){
      const out = f.before[f.turnBefore];
      const s = out && by[out.id];
      if(s){
        s.turns++;
        s.bestTurn = Math.max(s.bestTurn, running[out.id]);
        running[out.id] = 0;
      }
      g.turns++;
    }

    const now = leaderOf(f.after);
    if(lead && now && now !== lead) g.leadChanges++;
    lead = now;
    leads.push(now);
    moved.push(material);
  });

  /* The turning point is the last time somebody else was definitively ahead.
     Finding it takes two steps, because the frame where the lead settles is
     usually not the frame that settled it: a game sits level for a while
     (leaderOf returns null through the tie) and the lead only reads as the
     winner's again a few entries later, often on an End of turn. So find where
     the lead comes back for good, then walk back to the last entry that
     actually changed the board — the move deserves the credit, not the
     bookkeeping that followed it. */
  const champ = (g.winner && g.winner.id) || leaderOf(G.players);
  if(champ){
    let last = -1;
    leads.forEach((id, i) => { if(id && id !== champ) last = i; });
    if(last < 0){ g.ledThroughout = true; return g; }
    let i = last + 1;
    while(i < fs.length && leads[i] !== champ) i++;
    if(i < fs.length){
      while(i > 0 && !moved[i]) i--;
      g.turning = fs[i];
    }
  }
  return g;
}

/* ==========================================================================
   Live sharing

   One phone runs the game and pushes after every action; everyone else opens a
   link and polls. It talks to a Supabase table over plain REST — no SDK, no
   CDN script — so this stays one self-contained file.

   Two rules hold the whole thing together:
     · nothing happens until someone taps Start sharing, so a game that never
       shares makes no network requests at all;
     · every request is fire-and-forget. Losing signal must never cost a turn.
   ========================================================================== */

/* Both of these set = sharing is available. Either one blank and the app is
   exactly as offline as it was before any of this existed.
   The key is Supabase's publishable key, which belongs in a public page — the
   table's row-level security is what actually decides who can do what. The
   secret / service_role key must never appear here. */
const SYNC_URL = 'https://mfjibppjqcodmrshfjbt.supabase.co';
const SYNC_KEY = 'sb_publishable_BJ02mjBe1S6_56ZioeEC5g_RlDi7SFu';
/* Hardcoded rather than read off location, so a link made from the Claude
   artifact preview still points at the real site. */
const SHARE_URL = 'https://matthewnhorowitz-bot.github.io/frequent-flyer/';

const syncOn  = () => !!(SYNC_URL && SYNC_KEY);
const gameUrl = code => SHARE_URL + '#' + code;

/* One row per game, keyed by the four-digit code. `cols` keeps the reply down to
   what's actually wanted — the poll asks for `rev` alone, three bytes of answer. */
const sbRow  = (code, cols) => SYNC_URL + '/rest/v1/games?select=' + cols +
  '&code=eq.' + encodeURIComponent(code);
const sbHead = extra => Object.assign({apikey:SYNC_KEY, Authorization:'Bearer '+SYNC_KEY}, extra||{});

/* A rejected request answers with an error object rather than a row array, so
   turn anything that isn't a clean 2xx into a throw and let the caller treat it
   as "couldn't reach it" — which is true, and is never "no such game". */
function sbGet(url){
  return fetch(url, {headers:sbHead()}).then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(rows => Array.isArray(rows) ? rows : []);
}

let shareErr = false;   // the last push failed — the Share card says so instead of claiming live
let shareAt  = 0;       // when the last push landed
let viewErr  = false;   // a viewer's last poll failed
let viewAt   = 0;       // the host's clock when the state we're showing was pushed

/* ---------- what goes over the wire ----------
   Every log entry carries a full player snapshot in `undo` for the undo stack.
   That is most of G's bytes and is meaningless to someone watching, so it is
   dropped — which also keeps a long game comfortably inside the size limit. */
function shareState(){
  return JSON.stringify({
    v:1, target:G.target, turn:G.turn, status:G.status, winner:G.winner,
    players:G.players, bounties:G.bounties,
    log: G.log.slice(0,150).map(e=>({who:e.who, text:e.text, detail:e.detail, t:e.t})),
  });
}

/* Rebuild something shaped exactly like G, so every existing screen renders a
   watched game without knowing it is watching one. */
function hydrateShare(raw){
  const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
  return {
    v:1, target:o.target||20, turn:o.turn||0, started:0,
    status:o.status||'playing', winner:o.winner||null,
    players:o.players||[], bounties:o.bounties||[],
    log:(o.log||[]).map(e=>({id:uid(), t:e.t||0, who:e.who, text:e.text, detail:e.detail, undo:null})),
  };
}

/* ---------- host ---------- */

/* Four digits — short enough to say once and have everyone get it. */
const SHARE_CODE = /^\d{4}$/;
function makeCode(){
  return String(Math.floor(Math.random()*10000)).padStart(4,'0');
}

/* Only 10,000 codes, so retry harder than the collision rate alone would need —
   finished games stay in the database and keep their code taken. If the check
   itself fails we take the code anyway: being offline shouldn't block sharing. */
function startShare(){
  let code = makeCode(), tries = 0;
  const claim = () => sbGet(sbRow(code,'code')).catch(()=>[])
    .then(rows => {
      if(rows.length && ++tries < 12){ code = makeCode(); return claim(); }
      G.share = {code, on:true};
      shareErr = false; shareAt = 0;
      save();
      render();
    });
  return claim();
}

function stopShare(){
  if(G.share) G.share.on = false;
  clearTimeout(pushTimer);
  save();
}

let pushTimer = null;
/* One tap can produce several commits — a card effect, then the auto end of
   turn — and only the last state is worth sending. */
function pushShare(){
  if(!syncOn()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, 600);
}

function doPush(){
  const s = G && G.share;
  if(!s || !s.on) return;
  /* rev doubles as the change token viewers poll and the timestamp they show.
     Wall-clock rather than a counter, so it still climbs after a page reload. */
  const now = Date.now();
  /* An upsert: first push for a code creates the row, every one after overwrites
     it. `return=minimal` because the row we just sent is no use coming back. */
  fetch(SYNC_URL + '/rest/v1/games', {
    method:'POST',
    headers: sbHead({'Content-Type':'application/json',
                     Prefer:'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify({code:s.code, rev:now, t:now, state:shareState()}),
  })
  .then(r => { shareErr = !r.ok; if(r.ok) shareAt = now; })
  .catch(() => { shareErr = true; })
  .then(paintSync);
}

/* ---------- viewer ---------- */

let pollTimer = null, seenRev = 0;
const pollOff = () => { clearInterval(pollTimer); pollTimer = null; };
const pollOn  = () => { pollOff(); pollTimer = setInterval(pollShare, 4000); };

function bootView(code){
  VIEW = true;
  UI = {screen:'loading', sub:null, tmp:{}, code};
  render();
  document.addEventListener('visibilitychange', ()=>{
    // A backgrounded phone shouldn't sit there burning data.
    if(document.hidden) pollOff();
    else if(G){ pollOn(); pollShare(); }
  });
  pullShare().then(ok => { if(ok) pollOn(); });
}

function pullShare(){
  return sbGet(sbRow(UI.code, 'rev,t,state'))
    .then(rows => {
      const d = rows[0];
      if(!d || !d.state){ UI.viewErr = 'notfound'; render(); return false; }
      seenRev = Number(d.rev) || 0; viewAt = Number(d.t) || 0; viewErr = false;
      G = hydrateShare(d.state);
      UI.viewErr = null; UI.screen = 'turn';
      render();
      return true;
    })
    .catch(() => { UI.viewErr = 'offline'; render(); return false; });
}

/* Poll the tiny `rev` number, not the whole game — the state only comes down
   when it has actually changed, which keeps a long session to a few hundred KB. */
function pollShare(){
  if(!UI.code) return;
  sbGet(sbRow(UI.code,'rev')).then(rows => {
    viewErr = false;
    const rev = rows[0] ? Number(rows[0].rev) : 0;
    if(rev && rev !== seenRev){
      seenRev = rev;
      return sbGet(sbRow(UI.code,'state')).then(rows2 => {
        const s = rows2[0] && rows2[0].state;
        if(!s) return;
        G = hydrateShare(s); viewAt = rev;
        // Re-rendering scrolls to the top; a spectator mid-way down the history
        // did not ask to be yanked back up there.
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
      });
    }
    paintSync();
  }).catch(() => { viewErr = true; paintSync(); });
}
</script>
<script>
/* ==========================================================================
   Rendering
   ========================================================================== */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const go  = (screen, sub) => { UI.screen = screen; UI.sub = sub||null; UI.tmp = {}; render(); };
const sub = s => { UI.sub = s; UI.tmp = {}; render(); };

/* A city field opens the search screen instead of a native dropdown — twenty
   cities is more than a phone dropdown wants to be. `only` restricts the list. */
function cityField(name, value, only){
  const c = value ? CITIES[CIDX[value]] : null;
  return '<button class="pick'+(c?'':' empty')+'" data-act="cityopen" data-v="'+name+'"' +
    (only ? ' data-only="'+only.join(',')+'"' : '') + '>' +
    '<span class="pn">' + (c ? c.n+'. '+esc(c.name) : 'Select a city…') + '</span>' +
    (c ? '<span class="pc">'+c.id+'</span>' : '') +
    '<span class="pa">›</span></button>';
}
function oppSelect(name, value){
  return '<select data-in="'+name+'"><option value="">Select a player…</option>' +
    opponents(cur()).map(o=>'<option value="'+o.id+'"'+(value===o.id?' selected':'')+'>'+esc(o.name)+'</option>').join('') +
    '</select>';
}

/* ---------- brand ---------- */
/* Drawn inline rather than linked, so the app still works with no network.
   The artwork itself lives in b0_brand.html — this is only the lockup. */
function mark(size){
  return brand('mono', size, 'mk');
}
/* Hero lockup: seal over wordmark. `size` is the seal's width; the wordmark
   sizes itself off the panel so it stays put on a 320px phone. */
function logo(size){
  return '<div class="logo">' + brand('seal', size, 'seal') +
    '<div class="wm">' + brand('word', 268, 'word') +
    '<div class="rule"></div><div class="w2">Race Across the States</div></div></div>';
}

/* ---------- shared bits ---------- */
/* Setting up a new game leaves the previous game loaded in G, so Undo has to be
   gated on the screen too — otherwise it offers to undo a game you're replacing. */
const PREGAME = ['start','count','setup','order'];

/* The mark takes the Back button's slot rather than sitting beside it — on a
   320px bar, back + mark + title + undo is one element too many. */
function header(title, backTo){
  const canUndo = !VIEW && G && G.status==='playing' && PREGAME.indexOf(UI.screen) < 0;
  return '<div class="top"><div class="top-row">' +
    (backTo!==undefined ? '<button class="btn chipbtn" data-act="back">‹ Back</button>' : mark(20)) +
    '<div class="brand">'+esc(title)+'</div><div class="spacer"></div>' +
    (canUndo ? '<button class="btn chipbtn ghost" data-act="undo" '+(G.log.length?'':'disabled')+'>Undo</button>' : '') +
    '</div></div>';
}

/* Grey = not yet, pale green = one visit, green with a tick = done. In the
   40-city game a city needs two visits, so the middle state is the one that
   matters — hence one green at two strengths rather than two colours. */
function cityChips(p){
  const max = maxVisits();
  return '<div class="chips">' + CITIES.map(c=>{
    const n = visitCount(p, c.id);
    const cls = ['chip'];
    if(n >= max) cls.push('on'); else if(n > 0) cls.push('v1');
    if(c.id===p.home) cls.push('home');
    if(c.id===p.at) cls.push('here');
    return '<span class="'+cls.join(' ')+'"><span class="cn">'+c.n+'</span>'+c.id +
      (max>1&&n?'<i>'+n+'</i>':'')+'</span>';
  }).join('') + '</div>';
}

/* Two airport codes and the leg between them — see .route in a_shell.html. */
function routeStrip(from, to){
  const z = id => '<span class="rz"><b>'+id+'</b><span>'+esc(cityName(id))+'</span></span>';
  return '<div class="route">' + z(from) +
    '<span class="rl"><span class="rp">'+ico('plane')+'</span></span>' + z(to) + '</div>';
}

function playerRow(p, i, active){
  return '<div class="pcard'+(active?' active':'')+'">' +
    '<div class="pawn p'+i+'">'+esc(p.name.slice(0,1).toUpperCase())+'</div>' +
    '<div><div class="pname">'+esc(p.name)+'</div>' +
    '<div class="pmeta">'+visitedCount(p)+'/'+G.target+' '+stopWord()+' · in '+esc(cityName(p.at)) +
      (p.firstClass?' · <b>First class</b>':'') + (p.skip?' · skips '+p.skip:'') + '</div></div>' +
    '<div class="pmiles">'+fmt(p.miles)+'<small>MILES</small></div></div>';
}

function navBar(){
  const t = (id,ico,label)=> '<button data-act="nav" data-v="'+id+'" class="'+(UI.screen===id?'on':'')+'">' +
    '<span class="ni">'+ico+'</span><span>'+label+'</span></button>';
  return '<div class="nav">'+t('turn',ico('plane'),'Turn')+t('scores',ico('clipboard'),'Scores') +
    t('history',ico('clock'),'History')+'</div>';
}

/* Ending a turn is the one thing you do every single turn, so it rides in a
   fixed dock with the tab bar instead of at the bottom of a scrolling page. */
function dock(withEndTurn){
  let h = '<div class="dock">';
  if(withEndTurn){
    // Ring the button only when the turn is still open. Once it has auto-ended
    // there is nothing left to prompt for — the banner carries the undo instead.
    const ring = UI.flash && !UI.flash.ended;
    h += '<div class="endbar'+(ring?' ready':'')+'">' +
      '<button class="btn primary big" data-act="endturn">End turn → ' +
      esc(G.players[(G.turn+1)%G.players.length].name) + '</button></div>';
  }
  return h + navBar() + '</div>';
}

/* ==========================================================================
   Screens
   ========================================================================== */

function screenStart(){
  const saved = load();
  const going = saved && saved.status === 'playing';

  let h = '<div style="height:22px"></div><div class="hero">' + logo(92) +
    '<div class="center xtiny" style="margin-top:20px;opacity:.75;' +
      'letter-spacing:.16em;text-transform:uppercase;font-weight:700">Scorekeeper</div></div>';

  h += '<p class="lede">Keep playing with the board, cards and pawns. ' +
    'This app tracks miles, cities and whose turn it is.</p>';

  /* A game in progress goes above the new one and takes the primary weight:
     if there is a game loaded, carrying on with it is why the app was opened. */
  if(going){
    h += '<button class="resume" data-act="resume">' +
      '<span class="rh"><span class="lv"></span>Game in progress</span>' +
      saved.players.map((p,i)=>
        '<span class="rr"><span class="pawn p'+i+'">'+esc(p.name.slice(0,1).toUpperCase())+'</span>' +
        '<b>'+esc(p.name)+'</b><em>'+fmt(p.miles)+'<span>MI</span></em></span>').join('') +
      '</button>';
  }

  h += '<button class="btn '+(going?'':'primary ')+'big" data-act="new">Start a new game</button>';
  // For everyone at the table who isn't keeping score.
  if(syncOn()) h += '<button class="btn ghost" data-act="watch">Watch someone else\'s game' +
    '<span class="sub">Type the four digits they read out</span></button>';
  return h;
}

/* ---------------------------- new game ---------------------------- */

/* Setting a game up is three screens, so each one says where it sits in the
   three. Filled bars behind you, hollow ahead. */
const STEPS = ['Players','Names & homes','Play order'];
function steps(i){
  return '<div class="steps"><div class="sb">' +
    STEPS.map((_,k)=>'<i class="'+(k<=i?'on':'')+'"></i>').join('') +
    '</div><div class="sl">Step '+(i+1)+' of '+STEPS.length+' · '+STEPS[i]+'</div></div>';
}

function screenCount(){
  let h = header('New game', 1) + steps(0);
  h += '<div class="mid"><h3 style="margin-bottom:7px">How many players?</h3>' +
    '<p class="hint">Frequent Flyer is for two to four.</p>';
  h += '<div class="pcount">' + [2,3,4].map(n=>
    '<button class="pct" data-act="count" data-v="'+n+'">' +
    '<span class="pw">' + Array.from({length:n},(_,i)=>'<i class="p'+i+'"></i>').join('') + '</span>' +
    '<span class="n">'+n+'</span><span class="l">players</span></button>').join('') + '</div>';
  h += '<p class="xtiny muted center">Names and home cities come next.</p></div>';
  return h;
}

const LENGTHS = [
  [20,'Standard game','All 20 cities, once each.'],
  [40,'Long game','Every city twice, in any order.']
];

function screenSetup(){
  const n = UI.tmp.count;
  const d = UI.tmp.data || (UI.tmp.data = Array.from({length:n},()=>({name:'',home:''})));
  const target = UI.tmp.target || (UI.tmp.target = 20);

  let h = header('New game', 1) + steps(1);
  h += '<h3 style="margin-bottom:7px">Who’s playing?</h3>' +
    '<p class="hint">Names are optional. No two players may share a home city.</p>';

  d.forEach((p,i)=>{
    // Homes already spoken for simply aren't in the picker — a disabled row you
    // can still see and tap is a worse answer than one that isn't offered.
    const taken = d.filter((_,j)=>j!==i).map(x=>x.home).filter(Boolean);
    const free = CITIES.map(c=>c.id).filter(id => taken.indexOf(id) < 0);
    h += '<div class="card pform'+(p.home?' done':'')+'">' +
      '<div class="ph"><span class="num">'+(i+1)+'</span><b>Player '+(i+1)+'</b>' +
      // Only the finished state is called out. The empty picker below already
      // says what is missing, and three cards all shouting it is nagging.
      '<span class="st">'+(p.home?'Ready':'')+'</span></div>' +
      '<label class="fld"><span>Name</span><input type="text" data-in="name'+i+'" value="'+esc(p.name)+'" placeholder="Player '+(i+1)+'" autocomplete="off"></label>' +
      '<div class="fld" style="margin-bottom:0"><span>Home city</span>' +
      cityField('home'+i, p.home, free) + '</div></div>';
  });

  h += '<div class="card"><h3 style="font-size:16px">Game length</h3>' +
    '<p class="hint" style="margin:6px 0 12px">Reach this many stops, then fly home to win. ' +
    'Your home city counts as your first.</p>' +
    LENGTHS.map(o => '<button class="opt'+(target===o[0]?' on':'')+'" data-act="target" data-v="'+o[0]+'">' +
      '<span class="rd"></span><span><span class="ot">'+o[0]+' cities · '+o[1]+'</span>' +
      '<span class="od">'+o[2]+'</span></span></button>').join('') + '</div>';

  const ready = d.every(p=>p.home) ;
  h += '<button class="btn primary big" data-act="begin" '+(ready?'':'disabled')+'>' +
    (ready?'Next: play order':'Pick a home city for each player')+'</button>';
  return h;
}

/* ---------------------------- play order ---------------------------- */

const ORDINALS = ['1st','2nd','3rd','4th'];
/* Blank names become "Player N" at construction, so show that here too rather
   than an empty row. */
const setupName = (p,i) => p.name.trim() || ('Player '+(i+1));

function screenOrder(){
  const d = UI.tmp.data;
  const order = UI.tmp.order || (UI.tmp.order = []);
  const done = order.length === d.length;

  let h = header('New game', 1) + steps(2);
  h += '<p class="hint">Roll the 20-sided die — highest roll goes first.</p>';

  // Seated players sit on the page, like the list of unseated ones below them —
  // a .pcard already draws its own frame, so a card around them is a second.
  if(order.length){
    h += '<div class="ordhd"><span class="sechd">' + (done ? 'Play order' : 'So far') +
      '</span><button class="btn chipbtn ghost" data-act="unpick">' +
      (done ? 'Change' : 'Undo') + '</button></div>';
    h += order.map((di,pos)=>
      '<div class="pcard"><div class="pawn p'+pos+'">'+(pos+1)+'</div>' +
      '<div><div class="pname">'+esc(setupName(d[di],di))+'</div>' +
      '<div class="pmeta">'+ORDINALS[pos]+' to play · home '+esc(cityName(d[di].home))+'</div></div></div>'
    ).join('');
  }

  if(done){
    h += '<button class="btn primary big" data-act="startgame" style="margin-top:16px">Start game</button>';
    return h;
  }

  // The list draws its own frame, so it sits on the page rather than inside a
  // card — nested inside one it would be a border drawn twice.
  h += '<h3 style="font-size:17px;margin:'+(order.length?'22px':'0')+' 0 7px">Who goes ' +
    ORDINALS[order.length] + '?</h3>' +
    '<p class="hint">Tap a player.</p><div class="list">';
  h += d.map((p,i)=> order.indexOf(i) >= 0 ? '' :
    '<button class="row" data-act="pick" data-v="'+i+'">' +
    '<span><span class="n">'+esc(setupName(p,i))+'</span>' +
    '<span class="d">Home: '+esc(cityName(p.home))+'</span></span>' +
    '<span class="r">›</span></button>').join('');
  h += '</div>';
  return h;
}

/* ---------------------------- turn screen ---------------------------- */

/* Opponents down the right of the turn screen, next-to-play first — that is the
   one you weigh a move against. Tapping a tile opens that player's checklist. */
function oppRail(){
  const n = G.players.length;
  const rest = [];
  for(let k = 1; k < n; k++) rest.push(G.players[(G.turn + k) % n]);

  return '<div class="rail">' + rest.map((p,k)=>
    '<button class="opp" data-act="player" data-v="'+p.id+'">' +
    (k===0 ? '<div class="nx">Next</div>' : '') +
    '<div class="oh"><div class="pawn p'+G.players.indexOf(p)+'">' +
      esc(p.name.slice(0,1).toUpperCase())+'</div>' +
      '<div class="onm">'+esc(p.name)+'</div></div>' +
    '<div class="om">'+fmt(p.miles)+'</div>' +
    '<div class="oc">'+visitedCount(p)+'/'+G.target+' '+stopWord()+'</div>' +
    '</button>').join('') + '</div>';
}

function screenTurn(){
  if(G.status === 'finished') return screenWin();
  const p = cur();
  let h = header('Turn', undefined);

  h += flashBanner();

  h += '<div class="card pass"><div class="stub">' +
    '<span class="sl">Boarding pass</span>' +
    '<span class="sr">' + brand('word', 78) + '</span></div>' +
    '<div class="turnrow"><div class="turnmain">';

  h += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">' +
    '<div class="pawn p'+G.turn+'">'+esc(p.name.slice(0,1).toUpperCase())+'</div>' +
    '<div><div style="font-weight:800;font-size:19px">'+esc(p.name)+'</div>' +
    '<div class="tiny muted">Currently in '+esc(cityName(p.at))+
      (p.firstClass?' · <b style="color:var(--first)">First class</b>':'')+'</div></div></div>';

  h += '<div class="stat"><div class="n">'+fmt(p.miles)+'</div><div class="l">Frequent flyer miles</div></div>';

  const seen = visitedCount(p);
  const pct = Math.min(100, Math.round(seen/G.target*100));
  const full = seen >= G.target;
  h += '<div class="bar'+(full?' full':'')+'"><i style="width:'+pct+'%"></i></div>' +
    '<div class="xtiny muted center" style="margin-bottom:12px">' +
    '<b class="cnt">'+seen+'</b> of '+G.target+' '+stopWord()+' visited' +
    (full ? ' — fly home to '+esc(cityName(p.home))+' to win!' : '') + '</div>';

  h += '</div></div>';   // close .turnmain, close .turnrow

  h += '<div class="perf"></div>' + cityChips(p) + '</div>';

  if(p.mult > 1) h += '<div class="banner warn">'+ico('bolt')+' '+p.mult+'× mileage is armed — it applies to your next completed flight.</div>';
  if(G.bounties.length) h += G.bounties.map(b=>'<div class="banner">'+ico('target')+' '+fmt(b.amount)+' miles waiting in '+esc(cityName(b.city))+' for the next player to land there.</div>').join('');

  /* Opponents come last on the screen, not down the side of the boarding pass.
     Beside it they made the card taller with every extra player until the
     checklist slid under the End turn bar; between the checklist and the
     actions they pushed the actions off instead. Below everything, the two
     things you touch on your turn stay put whether there are two of you or
     four — and there is a whole Scores tab for studying rivals. */
  if(VIEW) return h + oppRail();   // a spectator gets the state, not the controls

  h += '<div class="actions">' +
    act('deck',ico('cards'),'Card','Log a card you just drew') +
    act('flight',ico('plane'),'Flight completed','Enter two cities and bank the miles') +
    act('redeem',ico('card'),'Redeem miles','5,000 · 10,000 · 20,000') +
    (p.hand.length ? act('hand',ico('ticket'),'Held cards','You are holding '+p.hand.length+' card'+(p.hand.length>1?'s':'')) : '') +
    '</div>';

  h += '<div class="btn-row" style="margin-top:12px">' +
    '<button class="btn ghost" data-act="sub" data-v="cities" style="text-align:center">Edit cities</button>' +
    '<button class="btn ghost" data-act="sub" data-v="adjust" style="text-align:center">Adjust miles</button></div>';

  return h + oppRail();   // End turn lives in the dock, not here
}

/* What just happened, and whether it took the turn with it.
   `ended` — the app passed the turn on; offer the way back.
   otherwise — the turn is still theirs; nudge them toward End turn. */
function flashBanner(){
  const f = UI.flash;
  if(!f) return '';
  if(!f.ended) return '<div class="banner" style="border-color:var(--good);color:var(--good)">' +
    ico('plane')+' <b>'+esc(f.text)+'</b> — anything else this turn?</div>';
  return '<div class="banner flash-end">' +
    '<div>'+ico('plane')+' <b>'+esc(f.who)+':</b> '+esc(f.text)+'</div>' +
    '<div class="fe-row"><span>Turn passed to <b>'+esc(f.next)+'</b>.</span>' +
    '<button class="btn chipbtn" data-act="undo">Undo — back to '+esc(f.who)+'</button></div></div>';
}
function act(v, icon, ttl, dsc){
  return '<button class="act" data-act="sub" data-v="'+v+'"><span class="ico">'+icon+'</span>' +
    '<span><span class="ttl">'+ttl+'</span><span class="dsc">'+dsc+'</span></span></button>';
}

function screenWin(){
  const w = byId(G.winner);
  let h = header('Game over', undefined);
  h += '<div class="center" style="margin:10px 0 18px"><span class="stamp">Arrived</span></div>';
  h += '<div class="banner win">'+ico('trophy')+' '+esc(w.name)+' wins!</div>';
  h += '<div class="card"><div class="stat"><div class="n">'+fmt(w.miles)+'</div>' +
    '<div class="l">Final mileage balance</div></div>' +
    '<p class="center tiny muted">' + (maxVisits()>1
      ? 'Visited all 20 cities twice — 40 stops'
      : 'Visited all '+G.target+' cities') +
    ' and returned home to '+esc(cityName(w.home))+'.</p></div>';
  h += '<div class="card"><h3 style="font-size:15px;margin-bottom:10px">Final standings</h3>' +
    G.players.slice().sort((a,b)=>visitedCount(b)-visitedCount(a)||b.miles-a.miles)
      .map((p,i)=>playerRow(p, G.players.indexOf(p), p.id===G.winner)).join('') + '</div>';
  h += '<button class="btn" data-act="recap">See the recap' +
    '<span class="sub">How the game was won</span></button>';
  h += '<button class="btn primary big" data-act="newconfirm">Start a new game</button>';
  h += '<button class="btn ghost" data-act="unwin">Keep playing (undo win)</button>';
  return h;
}

/* ---------------------------- sub-screens ---------------------------- */

function subDeck(){
  let h = header('Which deck?', 1);
  h += '<p class="hint">Which pile did you draw from?</p>';
  h += '<button class="btn big" data-act="deckpick" data-v="coach" style="border-color:var(--coach)">' +
    '<span style="color:var(--coach)">Coach card</span><span class="sub">45 cards · drawn on a normal flight</span></button>';
  h += '<button class="btn big" data-act="deckpick" data-v="first" style="border-color:var(--first)">' +
    '<span style="color:var(--first)">First class card</span><span class="sub">25 cards · drawn while flying first class</span></button>';
  return h;
}

function subCards(){
  const deck = UI.tmp.deck;
  const q = (UI.tmp.q||'').toLowerCase();
  const list = CARDS.filter(c=>c.deck===deck && (!q || c.title.toLowerCase().includes(q) || c.text.toLowerCase().includes(q)));
  let h = header(deck==='coach'?'Coach cards':'First class cards', 1);
  h += '<label class="fld"><input type="text" data-in="q" value="'+esc(UI.tmp.q||'')+'" placeholder="Search cards…" autocomplete="off"></label>';
  h += '<p class="hint">Tap the card you drew.</p><div class="list">';
  h += list.map(c=>'<button class="row" data-act="cardpick" data-v="'+c.id+'">' +
    '<span class="deckdot '+c.deck+'"></span>' +
    '<span><span class="n">'+esc(c.title)+'</span><span class="d">'+esc(c.text.slice(0,64))+(c.text.length>64?'…':'')+'</span></span>' +
    '</button>').join('') || '<div style="padding:18px" class="muted center">No cards match.</div>';
  h += '</div>';
  return h;
}

function subCard(){
  const c = CARDS_BY_ID[UI.tmp.card];
  const fromHand = !!UI.tmp.fromHand;
  const ans = UI.tmp.ans || (UI.tmp.ans = {});
  const fx = resolveFx(c, ans);
  const needs = cardNeeds(c.fx);
  const p = cur();

  let h = header('Card', 1);
  h += '<div class="gcard '+c.deck+'">' +
    '<div class="gd">'+(c.deck==='coach'?'Coach':'First class')+'</div>' +
    '<div class="gt">'+esc(c.title)+'</div>' +
    '<div class="gx">'+esc(c.text)+'</div>' +
    (c.footer?'<div class="gf">'+esc(c.footer)+'</div>':'') + '</div>';

  const willHold = c.fx.hold && !fromHand;
  if(willHold){
    h += '<div class="banner">'+ico('ticket')+' This card is saved to '+esc(p.name)+'’s hand. Play it later from <b>Held cards</b>.</div>';
    h += '<button class="btn primary big" data-act="apply">Save to hand</button>';
    return h;
  }

  let missing = false;
  // branch choice
  if(c.fx.choice){
    h += '<div class="card"><h3 style="font-size:15px;margin-bottom:10px">Choose one</h3>';
    c.fx.choice.forEach((o,i)=>{
      h += '<button class="btn'+(ans.branch===i?' primary':'')+'" data-act="branch" data-v="'+i+'">'+esc(o.label)+'</button>';
    });
    h += '</div>';
    if(ans.branch == null) missing = true;
  }

  // city input
  if(fx.fly === 'choose' || fx.addCity === 'choose'){
    h += '<div class="card"><label class="fld" style="margin:0"><span>' +
      (fx.addCity==='choose'?'City to add to your checklist':'City you are flying to') +
      '</span>'+cityField('city', ans.city)+'</label></div>';
    if(!ans.city) missing = true;
  } else if(Array.isArray(fx.fly)){
    h += '<div class="card"><label class="fld" style="margin:0"><span>Which city?</span>' +
      cityField('city', ans.city, fx.fly)+'</label></div>';
    if(!ans.city) missing = true;
  }

  // opponent input
  if(fx.oppFly || fx.skipOpp || fx.stealCity || fx.stealCard){
    h += '<div class="card"><label class="fld"'+((fx.stealCity||fx.stealCard)?'':' style="margin:0"')+'>' +
      '<span>Which opponent?</span>'+oppSelect('oppId', ans.oppId)+'</label>';
    if(!ans.oppId) missing = true;

    if(fx.stealCity && ans.oppId){
      const o = byId(ans.oppId);
      const stealable = [...new Set(o.visited)].filter(cid=>cid !== o.home);
      h += stealable.length
        ? '<label class="fld" style="margin:0"><span>Take which city?</span>' + cityField('oppCity', ans.oppCity, stealable) + '</label>'
        : '<div class="banner warn" style="margin:0">'+esc(o.name)+' has no cities you can take (home city is protected).</div>';
      if(stealable.length && !ans.oppCity) missing = true;
      if(!stealable.length) missing = false;
    }
    if(fx.stealCard && ans.oppId){
      const o = byId(ans.oppId);
      h += o.hand.length
        ? '<label class="fld" style="margin:0"><span>Take which card?</span><select data-in="cardId">' +
            '<option value="">Select a card…</option>' +
            o.hand.map(cid=>'<option value="'+cid+'"'+(ans.cardId===cid?' selected':'')+'>'+esc(CARDS_BY_ID[cid].title)+'</option>').join('') +
          '</select></label>'
        : '<div class="banner warn" style="margin:0">'+esc(o.name)+' is not holding any cards.</div>';
      if(o.hand.length && !ans.cardId) missing = true;
      if(!o.hand.length) missing = false;
    }
    h += '</div>';
  }

  if(fx.note) h += '<div class="banner">'+ico('clipboard')+' '+esc(fx.note)+'</div>';
  if(fx.fly && fx.flyEarns && ans.city && p.at)
    h += '<div class="banner">Mileage '+esc(cityName(p.at))+' → '+esc(cityName(ans.city))+': <b>' +
      fmt(milesBetween(p.at, ans.city) * (p.mult||1))+'</b> miles'+(p.mult>1?' ('+p.mult+'× applied)':'')+'</div>';

  h += '<button class="btn primary big" data-act="apply" '+(missing?'disabled':'')+'>' +
    (missing?'Answer the question above':'Apply card')+'</button>';
  return h;
}

function subFlight(){
  const p = cur();

  const noMiles = !!UI.tmp.noMiles;

  const total = noMiles ? 0 : miles * (p.mult||1);

  let h = header('Flight completed', 1);
  h += '<div class="card">' +
    '<label class="fld"><span>Departed from</span>'+cityField('from', from)+'</label>' +
    '<label class="fld" style="margin-bottom:0"><span>Landed in</span>'+cityField('to', to)+'</label></div>';

  if(to && to === from) h += '<div class="banner warn">Departure and destination are the same city.</div>';

  h += '<label class="toggle"><input type="checkbox" data-in="noMiles"'+(noMiles?' checked':'')+'>' +
    '<span><span class="tl">No miles earned on this flight</span>' +
    '<span class="td">For a 20,000-mile automatic flight, Private Jet, Homesick or Brotherly Love.</span></span></label>';

  if(to && to !== from){
    h += '<div class="card">' + routeStrip(from, to) +
      '<div class="kv"><span>Base mileage</span><b>'+fmt(miles)+'</b></div>' +
      (p.mult>1 ? '<div class="kv"><span>Card multiplier</span><b>'+p.mult+'×</b></div>' : '') +
      '<div class="kv"><span><b>Miles earned</b></span><b class="delta '+(total?'up':'')+'">'+(total?'+':'')+fmt(total)+'</b></div>' +
      '<div class="kv"><span>New balance</span><b>'+fmt(p.miles+total)+'</b></div>' +
      (canVisit(p,to)?'<div class="kv"><span>Checklist</span><b style="color:var(--done)">'+esc(cityName(to))+' ✓' +

/* Shared by the picker's first paint and its live filter, so typing and

    '<span class="code">'+c.n+'</span>' +
    '<span><span class="n">'+esc(c.name)+'</span><span class="d">'+c.id+'</span></span></button>').join('') ||
    '<div style="padding:18px" class="muted center">No cities match.</div>';

        (e.detail?'<div class="lt">'+esc(e.detail)+'</div>':'') + '</div>').join('')

/* ---------------------------- one player ----------------------------
   Read-only by design. Correcting somebody's cities stays on their own
   turn, through Edit cities, so a correction lands in the log as theirs. */
function screenPlayer(){
  const p = byId(UI.tmp.pid) || cur();
  const i = G.players.indexOf(p);
  const max = maxVisits();
  const left = CITIES.filter(c => visitCount(p, c.id) < max);

  // .pcard brings its own border, so it doesn't want a .card around it here.
  let h = header(p.name, 1) + playerRow(p, i, i === G.turn);

  const flags = [];
  if(i === G.turn && G.status === 'playing') flags.push(ico('die')+' Playing now');
  if(p.firstClass) flags.push(ico('sparkle')+' Flying first class');
  if(p.mult > 1)   flags.push(ico('bolt')+' '+p.mult+'× mileage armed');
  if(p.skip)       flags.push(ico('warn')+' Misses '+p.skip+' turn'+(p.skip>1?'s':''));
  if(p.hand.length)flags.push(ico('ticket')+' Holding '+p.hand.length+' card'+(p.hand.length>1?'s':''));
  /* Already markup — each flag is an icon plus a literal string, and the only
     interpolations are engine numbers. Escaping here would print the icon SVG
     as visible source, which is exactly what it used to do. */
  if(flags.length) h += '<div class="banner">'+flags.join(' · ')+'</div>';

  h += '<div class="card"><h3 class="sechd">Checked off — '+visitedCount(p)+' of '+G.target+'</h3>' +
    cityChips(p) + '</div>';

  h += '<div class="card"><h3 class="sechd">Still to go — '+left.length+'</h3>';
  h += left.length
    ? '<div class="list">' + left.map(c=>{
        const n = visitCount(p, c.id);
        return '<div class="row"><span class="code">'+c.n+'</span>' +
          '<span><span class="n">'+esc(c.name)+'</span>' +
          '<span class="d">'+c.id+(c.id===p.home?' · home city':'')+'</span></span>' +
          (max>1 ? '<span class="r">'+n+' of '+max+'</span>' : '') + '</div>';
      }).join('') + '</div>'
    : '<p class="tiny muted">Every city visited — now fly home to '+esc(cityName(p.home))+' to win.</p>';
  h += '</div>';

  const mine = G.log.filter(e => e.who === p.name).slice(0, 8);
  if(mine.length) h += '<div class="card"><h3 class="sechd">Recent</h3>' +
    mine.map(e=>'<div class="log"><div class="lw">'+esc(e.text)+'</div>' +
      (e.detail?'<div class="lt">'+esc(e.detail)+'</div>':'') + '</div>').join('') + '</div>';

  return h;
}

/* ---------------------------- the recap ----------------------------
   Reads recapStats(), which reconstructs the game from the snapshots the log
   already carries. Works mid-game as well as at the end, so the copy never
   assumes anybody has actually won. */

/* "42 minutes" — a game runs an evening at most, so hours are the ceiling. */
function spanText(ms){
  const m = Math.round(ms/60000);
  if(m < 1)  return 'under a minute';
  if(m < 60) return m + ' minute' + (m>1?'s':'');
  const h = Math.floor(m/60), r = m%60;
  return h + 'h' + (r ? ' ' + r + 'm' : '');
}

/* label / who / value — the same three-column row the city lists use. */
function recapRow(label, who, value){
  return '<div class="row"><span><span class="n">'+esc(label)+'</span>' +
    '<span class="d">'+esc(who)+'</span></span>' +
    '<span class="r">'+esc(value)+'</span></div>';
}

function screenRecap(){
  const s = recapStats();
  let h = header('Recap', 1);

  const champ = s.winner || G.players.slice()
    .sort((a,b)=>visitedCount(b)-visitedCount(a)||b.miles-a.miles)[0];

  h += '<div class="card"><div class="center">' +
    '<div style="font-size:32px;line-height:1">'+ico(s.winner?'trophy':'chart')+'</div>' +
    '<h3 style="font-size:19px;margin-top:8px">' +
      esc(champ.name) + (s.winner ? ' wins' : ' leads') + '</h3>';

  if(s.full){
    const bits = [s.turns + ' turn' + (s.turns===1?'':'s')];
    if(s.ms > 30000) bits.push(spanText(s.ms));
    bits.push(s.leadChanges ? s.leadChanges + ' lead change' + (s.leadChanges===1?'':'s')
                            : 'never headed');
    h += '<p class="tiny muted" style="margin-top:6px">'+esc(bits.join(' · '))+'</p>';
  }
  h += '</div></div>';

  /* Without snapshots there is no game to narrate — only the standings, which
     is exactly what a spectator's stripped log leaves behind. */
  if(!s.full){
    h += '<div class="card"><h3 class="sechd">Standings</h3>' +
      G.players.slice().sort((a,b)=>visitedCount(b)-visitedCount(a)||b.miles-a.miles)
        .map(p=>playerRow(p, G.players.indexOf(p), p.id===champ.id)).join('') +
      '<p class="tiny muted" style="margin-top:10px">' +
        (VIEW ? 'Turn-by-turn figures stay on the phone running the game.'
              : 'Nothing has happened yet — the recap fills in as you play.') +
      '</p></div>';
    return h;
  }

  if(s.turning){
    /* The leader and the player who acted are often different people — a
       redemption can hand the lead to somebody else — so name the leader in
       the claim and credit the action separately. */
    const t = s.turning.e;
    h += '<div class="card"><h3 class="sechd">Where it turned</h3>' +
      '<p style="font-size:15px"><b>'+esc(champ.name)+'</b> took the lead for good.</p>' +
      '<p class="tiny muted" style="margin-top:4px">'+esc(t.who)+' — '+esc(t.text) +
      (t.detail ? ' · ' + esc(t.detail) : '') + '</p></div>';
  } else if(s.ledThroughout){
    h += '<div class="card"><h3 class="sechd">Where it turned</h3>' +
      '<p style="font-size:15px">It never did — <b>'+esc(champ.name)+'</b> was in front ' +
      'from the first turn.</p></div>';
  }

  /* One superlative per line, and only when a single player actually holds it —
     "most flights" when everyone flew four times would just be naming whoever
     happens to sit first. Ties are dropped rather than broken arbitrarily. */
  const best = (pick, test) => {
    const live = s.rows.filter(test);
    if(!live.length) return null;
    const top = Math.max.apply(null, live.map(pick));
    const held = live.filter(r => pick(r) === top);
    return held.length === 1 ? held[0] : null;
  };
  const notes = [];

  const haul = best(r => r.haul.miles, r => !!r.haul);
  if(haul) notes.push(recapRow('Biggest haul',
    haul.p.name + ' · ' + cityName(haul.haul.from) + ' → ' + cityName(haul.haul.to),
    fmt(haul.haul.miles) + ' mi'));

  const most = best(r=>r.cities, r=>r.cities > 0);
  if(most) notes.push(recapRow('Most cities', most.p.name,
    most.cities + '/' + G.target));

  const turn = best(r=>r.bestTurn, r=>r.bestTurn > 0);
  if(turn) notes.push(recapRow('Best single turn', turn.p.name,
    fmt(turn.bestTurn) + ' mi'));

  const spent = best(r=>r.redeemed, r=>r.redeemed > 0);
  if(spent) notes.push(recapRow('Most redeemed', spent.p.name,
    fmt(spent.redeemed) + ' mi'));

  const busy = best(r=>r.flights, r=>r.flights > 0);
  if(busy) notes.push(recapRow('Most flights', busy.p.name,
    busy.flights + ''));

  if(notes.length) h += '<div class="card"><h3 class="sechd">Notable</h3>' +
    '<div class="list">' + notes.join('') + '</div></div>';

  h += '<div class="card"><h3 class="sechd">Every flyer</h3>' +
    s.rows.slice().sort((a,b)=>b.cities-a.cities||b.p.miles-a.p.miles).map(r=>{
      const per = r.turns ? (r.cities/r.turns).toFixed(1) : '—';
      return playerRow(r.p, G.players.indexOf(r.p), r.p.id===champ.id) +
        '<div class="list" style="margin:0 0 14px">' +
          recapRow('Turns taken', '', r.turns + '') +
          recapRow('Miles earned', '', fmt(r.earned)) +
          (r.redeemed ? recapRow('Miles redeemed', '', fmt(r.redeemed)) : '') +
          recapRow('Flights', '', r.flights + '') +
          recapRow('Cities per turn', '', per) +
        '</div>';
    }).join('') + '</div>';

  return h;
}

/* ==========================================================================
   Sharing — the host's panel and the spectator's bar
   ========================================================================== */

/* "12s ago" / "3m ago" — precise enough to tell live apart from stalled. */
function ago(t){
  const s = Math.max(0, Math.round((Date.now()-t)/1000));
  if(s < 60)   return s+'s ago';
  if(s < 3600) return Math.round(s/60)+'m ago';
  return Math.round(s/3600)+'h ago';
}

function shareCard(){
  if(VIEW || !syncOn() || !G) return '';
  const s = G.share;
  if(!s || !s.on) return '<div class="card"><h3 class="sechd">Share this game</h3>' +
    '<p class="tiny muted" style="margin:2px 0 12px">Everyone else gets a link and follows the ' +
    'scores on their own phone, updating as you play. They can watch, not touch.</p>' +
    '<button class="btn primary" data-act="sharestart">Start sharing</button></div>';

  return '<div class="card"><h3 class="sechd">Sharing live</h3>' +
    '<div class="codebig">'+esc(s.code)+'</div>' +
    '<p class="tiny muted center" style="margin:0 0 12px">Read that out, or send the link.</p>' +
    '<div id="syncState">'+syncStatus()+'</div>' +
    '<div class="btn-row">' +
      '<button class="btn" data-act="sharecopy" style="text-align:center">' +
        (navigator.share ? 'Send link' : 'Copy link') + '</button>' +
      '<button class="btn ghost" data-act="sharestop" style="text-align:center">Stop sharing</button>' +
    '</div></div>';
}

function syncStatus(){
  if(shareErr) return '<div class="sync bad">'+ico('warn')+' Can\'t reach the server — anyone watching is ' +
    'seeing an older scoreboard. Your game is unaffected.</div>';
  if(!shareAt) return '<div class="sync">Sending…</div>';
  return '<div class="sync ok">● Live · sent '+ago(shareAt)+'</div>';
}

function viewBar(){
  if(!VIEW) return '';
  return '<div class="viewbar"><span class="vbe">'+ico('eye')+'</span>' +
    '<div class="vbt"><b>'+esc(UI.code||'')+'</b>' +
    '<span id="viewState">'+viewStatus()+'</span></div>' +
    '<button class="btn chipbtn ghost" data-act="leaveview">Leave</button></div>';
}
function viewStatus(){
  // Don't claim to be watching a game we never found.
  if(UI.viewErr === 'notfound') return 'No such game';
  if(UI.viewErr === 'offline')  return 'Can\'t connect';
  if(!G)      return 'Connecting…';
  if(viewErr) return 'Reconnecting…';
  return 'Watching · updated ' + (viewAt ? ago(viewAt) : 'just now');
}

/* The status ticks without a re-render: render() scrolls to the top, and nobody
   asked to be sent there just because a poll came back. */
function paintSync(){
  const a = document.getElementById('syncState');
  if(a) a.innerHTML = syncStatus();
  const b = document.getElementById('viewState');
  if(b) b.innerHTML = viewStatus();
}

function screenViewLoading(){
  let h = '<div style="height:26px"></div><div class="hero">' + logo(92) + '</div>';
  if(UI.viewErr === 'notfound') h += '<div class="card"><h3>No game with that code</h3>' +
    '<p class="tiny muted" style="margin:8px 0 14px">Codes are four digits, like <b>4206</b>. Check it, ' +
    'or ask whoever is running the game — they may have stopped sharing.</p>' +
    '<button class="btn" data-act="leaveview">Back to my own game</button></div>';
  else if(UI.viewErr === 'offline') h += '<div class="card"><h3>Can\'t reach the game</h3>' +
    '<p class="tiny muted" style="margin:8px 0 14px">No connection, or the server isn\'t answering.</p>' +
    '<button class="btn" data-act="retryview">Try again</button>' +
    '<button class="btn ghost" data-act="leaveview">Back to my own game</button></div>';
  else h += '<div class="card center"><p class="muted" style="padding:10px">Loading ' +
    esc(UI.code||'game')+'…</p></div>';
  return h;
}

/* ==========================================================================
   Router
   ========================================================================== */
function render(){
  let h = '';
  if(UI.screen === 'loading')     h = screenViewLoading();
  else if(UI.screen === 'start')  h = screenStart();
  else if(UI.screen === 'count')  h = screenCount();
  // The city picker is a sub-screen of the turn flow everywhere else, but the
  // setup screen needs it too — and it is a screen, not a sub, so route it here.
  else if(UI.screen === 'setup')  h = UI.sub === 'citypick' ? subCityPick() : screenSetup();
  else if(UI.screen === 'order')  h = screenOrder();
  else if(UI.screen === 'scores') h = screenScores() + dock(false);
  else if(UI.screen === 'history')h = screenHistory() + dock(false);
  else if(UI.screen === 'player') h = screenPlayer() + dock(false);
  else if(UI.screen === 'recap')  h = screenRecap() + dock(false);
  else {
    const map = {deck:subDeck, cards:subCards, card:subCard, flight:subFlight, redeem:subRedeem,
                 auto:subAuto, hand:subHand, cities:subCities, adjust:subAdjust, citypick:subCityPick};
    // A finished game gets the tab bar but no End turn — there is no next turn.
    // Neither does a spectator, who has no turn to end.
    h = (UI.sub && map[UI.sub]) ? map[UI.sub]() : screenTurn() + dock(!VIEW && G.status === 'playing');
  }
  app.classList.toggle('viewing', VIEW);
  app.innerHTML = viewBar() + h;

  /* The dock is one bar on most screens and two on the turn screen, so reserve
     its measured height rather than guessing a constant. */
  const d = app.querySelector('.dock');
  app.style.paddingBottom = (d ? d.offsetHeight + 24 : 24) + 'px';

  window.scrollTo(0,0);
}
</script>
<script>
/* ==========================================================================
   Events
   ========================================================================== */

const VIEW_ACTS = ['nav','player','recap','back','leaveview','retryview'];

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;

  /* A spectator can navigate and nothing else. The read-only screens don't
     render the controls in the first place; this is the belt to that's braces,
     so a stale data-act can never mutate a watched game. */
  if(VIEW && VIEW_ACTS.indexOf(a) < 0) return;

  /* The post-action prompt is a one-shot: the next tap of anything dismisses it.
     The cases that end a turn set it again below. */
  UI.flash = null;

  switch(a){
    case 'new':
      UI.screen='count'; UI.tmp={}; render(); break;

    case 'newconfirm':
      if(confirm('Start a new game? The current game will be erased.')){ wipe(); G=null; go('start'); }
      break;

    case 'resume':
      G = load(); go('turn'); break;

    case 'count':
      UI.tmp = {count:+v, target:20}; UI.screen='setup'; render(); break;

    case 'target':
      UI.tmp.target = +v; render(); break;

    case 'begin': {
      const homes = UI.tmp.data.map(p=>p.home);
      if(new Set(homes).size !== homes.length){ alert('Each player needs a different home city.'); return; }
      UI.screen = 'order'; UI.tmp.order = []; render();
      break;
    }

    /* --- play order --- */
    case 'pick': {
      UI.tmp.order.push(+v);
      // With one player left there is nothing to choose, so seat them.
      if(UI.tmp.order.length === UI.tmp.data.length - 1){
        UI.tmp.data.forEach((_,i)=>{ if(UI.tmp.order.indexOf(i) < 0) UI.tmp.order.push(i); });
      }
      render(); break;
    }

    /* Step back to the last real decision — never to a question with one answer,
       which is what popping a single auto-seated player would leave. */
    case 'unpick':
      UI.tmp.order.pop();
      if(UI.tmp.order.length === UI.tmp.data.length - 1) UI.tmp.order.pop();
      render(); break;

    case 'startgame': {
      const players = UI.tmp.order.map(i=>{
        const p = UI.tmp.data[i];
        return newPlayer(p.name.trim() || ('Player '+(i+1)), p.home);
      });
      G = newGame(players, UI.tmp.target);
      save(); go('turn');
      break;
    }

    case 'nav':   UI.screen = v; UI.sub = null; UI.tmp = {}; render(); break;
    case 'sub':   sub(v); break;

    /* Reachable from the opponent rail and from any scoreboard row, so it
       remembers which one to go back to. */
    case 'player':
      UI.tmp = {pid:v, pfrom:UI.screen};
      UI.screen = 'player'; UI.sub = null; render(); break;

    /* Opened from the win screen or from History, so it remembers which —
       same reason the player screen does. */
    case 'recap':
      UI.tmp = {rfrom:UI.screen};
      UI.screen = 'recap'; UI.sub = null; render(); break;

    /* --- sharing --- */
    case 'sharestart': startShare(); break;
    case 'sharestop':  stopShare(); render(); break;

    case 'sharecopy': {
      const url = gameUrl(G.share.code);
      if(navigator.share)
        navigator.share({title:'Frequent Flyer', text:'Follow the game — code '+G.share.code, url}).catch(()=>{});
      else if(navigator.clipboard)
        navigator.clipboard.writeText(url).then(()=>alert('Link copied.')).catch(()=>prompt('Copy this link:', url));
      else prompt('Copy this link:', url);
      break;
    }

    case 'watch': {
      // Spaces stripped, because a code read out loud gets typed "42 06".
      const c = (prompt('Enter the 4-digit game code') || '').replace(/\s/g,'');
      if(SHARE_CODE.test(c)){ location.hash = c; location.reload(); }
      else if(c) alert('That is not a game code. They are four digits, like 4206.');
      break;
    }

    /* Drop the code from the URL, then reload — the boot path is the only thing
       that decides between watching and playing, so let it decide again. */
    case 'leaveview': location.replace(location.pathname + location.search); break;
    case 'retryview': pullShare().then(ok => { if(ok) pollOn(); }); break;

    /* --- city picker ---
       Deliberately not sub(), which wipes UI.tmp and would lose the half-filled
       form we have to return to. The scratch keys are underscored because
       UI.tmp.from is already the flight's departure and UI.tmp.q the card search. */
    case 'cityopen':
      UI.tmp._field = v;
      UI.tmp._back  = UI.sub;
      UI.tmp._only  = el.dataset.only ? el.dataset.only.split(',') : null;
      UI.tmp._q     = '';
      UI.sub = 'citypick'; render(); break;

    case 'citypicked': {
      const field = UI.tmp._field, back = UI.tmp._back;
      // The card screen keeps its answers in UI.tmp.ans; everything else in UI.tmp.
      if(back === 'card'){ UI.tmp.ans = UI.tmp.ans || {}; UI.tmp.ans[field] = v; }
      // The setup screen's homes live in UI.tmp.data, keyed the same way the
      // text inputs are — home0, home1 … — not as flat UI.tmp keys.
      else if(/^home(\d+)$/.test(field)) UI.tmp.data[+field.slice(4)].home = v;
      else UI.tmp[field] = v;
      delete UI.tmp._field; delete UI.tmp._back; delete UI.tmp._only; delete UI.tmp._q;
      UI.sub = back; render(); break;
    }
    case 'back':
      // Keep UI.tmp.data going back to setup, or the entered names are lost.
      // Same reason as cityopen: the form we came from is still half-filled in UI.tmp.
      if(UI.sub === 'citypick'){
        UI.sub = UI.tmp._back;
        delete UI.tmp._field; delete UI.tmp._back; delete UI.tmp._only; delete UI.tmp._q;
      }
      // Back to whichever screen the player was tapped on — rail or scoreboard.
      else if(UI.screen === 'player'){ UI.screen = UI.tmp.pfrom || 'scores'; UI.tmp = {}; }
      else if(UI.screen === 'recap'){ UI.screen = UI.tmp.rfrom || 'history'; UI.tmp = {}; }
      else if(UI.screen === 'order'){ UI.screen='setup'; delete UI.tmp.order; }
      else if(UI.screen === 'setup'){ UI.screen='count'; UI.tmp={}; }
      else if(UI.screen === 'count'){ UI.screen='start'; UI.tmp={}; }
      else if(UI.sub === 'cards'){ UI.sub='deck'; UI.tmp={}; }
      else if(UI.sub === 'card'){ UI.sub = UI.tmp.fromHand ? 'hand' : 'cards'; UI.tmp={deck:UI.tmp.deck}; }
      else if(UI.sub === 'auto'){ UI.sub='redeem'; UI.tmp={}; }
      else { UI.sub = null; UI.tmp = {}; }
      render(); break;

    case 'undo':
      undoLast(); UI.sub=null; UI.tmp={}; render(); break;

    case 'unwin':
      G.status='playing'; G.winner=null; save(); go('turn'); break;

    /* --- cards --- */
    case 'deckpick': UI.tmp = {deck:v}; UI.sub='cards'; render(); break;
    case 'cardpick': UI.tmp = {deck:UI.tmp.deck, card:v, ans:{}}; UI.sub='card'; render(); break;
    case 'playhand': UI.tmp = {card:v, fromHand:true, ans:{fromHand:true}}; UI.sub='card'; render(); break;
    case 'branch':   UI.tmp.ans.branch = +v; render(); break;

    case 'apply': {
      const c = CARDS_BY_ID[UI.tmp.card];
      const ans = UI.tmp.ans || {};
      ans.fromHand = !!UI.tmp.fromHand;
      /* Drawing a card is the end of a turn — except for a card that hands the
         die straight back, and except for one played out of your hand, which
         replaces your roll rather than following it. `flyIfNot` has to be read
         before the card resolves, since landing there changes the answer. */
      const fx = resolveFx(c, ans);
      const again = !!fx.again || (!!fx.flyIfNot && hasVisited(cur(), fx.flyIfNot));
      playCard(c, ans);
      const said = c.title + ' — ' + G.log[0].detail;
      if(ans.fromHand || again) UI.flash = {text:said, ended:false};
      else autoEnd(said);
      UI.sub = null; UI.tmp = {}; render();
      break;
    }

    /* --- flight --- */
    /* `p` stays valid across commit() — only undo's restore() reassigns G.players. */
    case 'doflight': {
      const p = cur(), to = UI.tmp.to, before = visitedCount(p);
      completeFlight(UI.tmp.from, to, !UI.tmp.noMiles);
      autoEnd(G.log[0].detail + (visitedCount(p) > before ? ' · '+to+' checked off' : ''));
      UI.sub=null; UI.tmp={}; render(); break;
    }

    /* --- redeem --- */
    case 'redeem':
      if(v === 'auto'){ UI.sub='auto'; UI.tmp={}; render(); }
      else { redeem(v); UI.sub=null; UI.tmp={}; render(); }
      break;

    case 'doauto': {
      const p = cur(), city = UI.tmp.city, before = visitedCount(p);
      redeem('auto', city);
      autoEnd(G.log[0].detail + (visitedCount(p) > before ? ' · '+city+' checked off' : ''));
      UI.sub=null; UI.tmp={}; render(); break;
    }

    /* --- misc --- */
    case 'togglecity': toggleCity(v); render(); break;

    case 'doadjust':
      adjustMiles(parseInt(UI.tmp.amt,10), (UI.tmp.why||'').trim());
      UI.sub=null; UI.tmp={}; render(); break;

    case 'endturn':
      endTurn(); UI.sub=null; UI.tmp={}; render(); break;
  }
});

/* Inputs: keep UI.tmp in sync. Selects and checkboxes re-render (they can
   change what the form shows); text inputs do not, so typing is not interrupted. */
app.addEventListener('input', e => {
  const el = e.target.closest('[data-in]');
  if(!el) return;
  const k = el.dataset.in;
  const val = el.type === 'checkbox' ? el.checked : el.value;

  if(/^name(\d+)$/.test(k)){ UI.tmp.data[+k.slice(4)].name = val; return; }

  if(UI.sub === 'card'){
    UI.tmp.ans = UI.tmp.ans || {};
    UI.tmp.ans[k] = val;
    if(k === 'oppId'){ delete UI.tmp.ans.oppCity; delete UI.tmp.ans.cardId; }
    render(); return;
  }

  UI.tmp[k] = val;

  // The adjust screen has a live preview. Patch it in place rather than
  // re-rendering, so the number field keeps focus while you type.
  if(UI.sub === 'adjust' && k === 'amt'){
    const n = parseInt(val,10);
    const btn = document.getElementById('adjBtn');
    const prev = document.getElementById('adjPrev');
    const bal = document.getElementById('adjBal');
    if(btn) btn.disabled = !n;
    if(prev) prev.style.display = n ? '' : 'none';
    if(bal) bal.textContent = fmt(cur().miles + (n||0));
    return;
  }

  if(el.tagName === 'SELECT' || el.type === 'checkbox') render();
});

/* City picker filters as you type. Patched in place, like the card search below,
   so the keyboard does not drop between keystrokes. */
app.addEventListener('input', e => {
  if(e.target.dataset && e.target.dataset.in === '_q' && UI.sub === 'citypick'){
    const box = app.querySelector('.list');
    if(box) box.innerHTML = cityRows(cityMatches());
  }
});

/* Search box filters as you type without losing focus. */
app.addEventListener('input', e => {
  if(e.target.dataset && e.target.dataset.in === 'q' && UI.sub === 'cards'){
    UI.tmp.q = e.target.value;
    const deck = UI.tmp.deck, q = UI.tmp.q.toLowerCase();
    const list = CARDS.filter(c=>c.deck===deck && (!q || c.title.toLowerCase().includes(q) || c.text.toLowerCase().includes(q)));
    const box = app.querySelector('.list');
    if(box) box.innerHTML = list.map(c=>'<button class="row" data-act="cardpick" data-v="'+c.id+'">' +
      '<span class="deckdot '+c.deck+'"></span>' +
      '<span><span class="n">'+esc(c.title)+'</span><span class="d">'+esc(c.text.slice(0,64))+(c.text.length>64?'…':'')+'</span></span>' +
      '</button>').join('') || '<div style="padding:18px" class="muted center">No cards match.</div>';
  }
});

/* ==========================================================================
   Boot
   ========================================================================== */
(function boot(){
  /* A share link's whole payload is its hash — #4206 — so one pattern test
     separates "watch this game" from an ordinary visit. */
  const code = decodeURIComponent((location.hash||'').replace(/^#\/?/,'')).trim();
  if(syncOn() && SHARE_CODE.test(code)) return bootView(code);

  const saved = load();
  if(saved && saved.status === 'playing'){ G = saved; UI.screen = 'start'; }
  render();
})();

/* Opening a share link while the app is already on screen only changes the
   hash, which is not a page load — so make it one. Also covers backing out of
   a watched game with the browser's own Back button. */
window.addEventListener('hashchange', () => location.reload());

/* Small sanity checks — surfaced in the console, not to players. */
(function selfCheck(){
  const errs = [];
  if(CARDS.filter(c=>c.deck==='coach').length !== 45) errs.push('coach deck is not 45 cards');
  if(CARDS.filter(c=>c.deck==='first').length !== 25) errs.push('first class deck is not 25 cards');
  if(CITIES.length !== 20) errs.push('city list is not 20 cities');
  for(let i=0;i<20;i++){
    if(MILEAGE[i][i] !== 0) errs.push('non-zero diagonal at '+CITIES[i].id);
    for(let j=i+1;j<20;j++) if(MILEAGE[i][j] !== MILEAGE[j][i])
      errs.push('asymmetric: '+CITIES[i].id+'/'+CITIES[j].id);
  }
  const ids = CARDS.map(c=>c.id);
  if(new Set(ids).size !== ids.length) errs.push('duplicate card ids');
  window.__ffCheck = errs;
  console.log(errs.length ? '❌ Frequent Flyer data errors: '+errs.join('; ')
                          : '✅ Frequent Flyer data OK — 20 cities, symmetric mileage, 45 coach + 25 first class cards.');
})();
</script>
